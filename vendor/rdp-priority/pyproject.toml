[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdp-priority-ai"
version = "1.0.0"
description = "RDP Priority AI development workflow CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - RDP internal use"}
dependencies = []

[project.scripts]
rdp-ai = "rdp_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
